{% set name = "xmacis2py" %}
{% set version = "2.5.1" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/xmacis2py-{{ version }}.tar.gz
  sha256: b2a77396747159ac4dffc1c9995fc1cd4cc0d409156b4d7fa48d047441c45845

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64.0.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base >=3.7
    - wxdata >=1.6.1

test:
  imports:
    - xmacis2py
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/edrewitz/xmACIS2Py
  summary: A Python package that brings the xmACIS2 Climate Analysis Tool into the Python Ecosystem
  license: MIT
  license_file: LICENSE
  doc_url: https://pypi.org/project/xmacis2py/
  dev_url: https://github.com/edrewitz/xmACIS2Py


extra:
  recipe-maintainers:
    - edrewitz
